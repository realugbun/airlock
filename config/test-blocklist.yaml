listen: ":8080"
service: "airlock-blocklist-test"
agent_id: "agent-blocklist"

providers:
  env: {}

routes:
  # Route 1: allow-only (strict whitelist)
  - path_prefix: "/api"
    upstream: "https://httpbin.org"
    strip_prefix: "/api"
    auth:
      type: static
      token:
        from: env
        key: "TOKEN"
      header: "Authorization"
      prefix: "Bearer "
    access_rules:
      - action: ALLOW
        method: GET
        path: /headers
      - action: ALLOW
        method: GET
        path: /get

  # Route 2: deny-then-allow (block destructive, allow rest)
  - path_prefix: "/open"
    upstream: "https://httpbin.org"
    strip_prefix: "/open"
    auth:
      type: static
      token:
        from: env
        key: "TOKEN"
      header: "Authorization"
      prefix: "Bearer "
    access_rules:
      - action: DENY
        method: DELETE
        path: /**
      - action: DENY
        method: PUT
        path: /**
      - action: DENY
        method: ALL
        path: /admin/**
      - action: ALLOW
        method: ALL
        path: /**

  # Route 3: broad allow with narrow deny exceptions
  - path_prefix: "/mixed"
    upstream: "https://httpbin.org"
    strip_prefix: "/mixed"
    auth:
      type: static
      token:
        from: env
        key: "TOKEN"
      header: "Authorization"
      prefix: "Bearer "
    access_rules:
      - action: DENY
        method: DELETE
        path: /anything/*
      - action: DENY
        method: ALL
        path: /anything/admin
      - action: ALLOW
        method: ALL
        path: /anything/**
